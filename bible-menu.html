<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Menu</title>
  <style>
    :root {
      --font-sans: 'Poppins', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: var(--font-sans);
      color: #F5F7FA;
    }

    .category {
      background-color: #1A1D24;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(79,140,255,0.7);
    }

    /* General Bible Quiz styling */
    .general {
      background: linear-gradient(
        to bottom right,
        #006400 50%,   /* dark green */
        #90EE90 100%   /* light green fade */
      );
      width: 100%; /* full width */
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .emoji {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .main-text {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtext {
      font-size: 14px;
      font-weight: 600;
      color: rgba(230,240,255,0.9);
      filter: blur(0.2px);
    }

    /* Grid for subject boxes */
    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    @media (max-width: 900px) {
      .subjects {
        grid-template-columns: repeat(2, 1fr); /* two per row on tablets */
      }
    }

    @media (max-width: 600px) {
      .subjects {
        grid-template-columns: repeat(2, 1fr); /* two per row on phones */
      }
      .main-text { font-size: 18px; }
      .subtext { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- General Bible Knowledge Quiz -->
  <div class="category general" onclick="location.href='bible.html'">
    <div class="main-text">General Bible Knowledge Quiz</div>
    <div class="subtext">Old Testament · New Testament</div>
  </div>

  <!-- Subject-specific categories -->
  <div class="subjects">
    <div class="category" onclick="location.href='old-testament.html'">
      <div class="emoji">📜</div>
      <div class="main-text">Old Testament</div>
      <div class="subtext">Genesis · Prophets · Psalms</div>
    </div>

    <div class="category" onclick="location.href='new-testament.html'">
      <div class="emoji">✝️</div>
      <div class="main-text">New Testament</div>
      <div class="subtext">Gospels · Acts · Epistles</div>
    </div>
  </div>
</body>
</html>
