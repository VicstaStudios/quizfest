<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #1c1c1c; /* dark grey background */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
    }

    /* Logo template with glow */
    .logo {
      width: 200px;
      height: 200px;
      background: url('quizfest-logo.png') center/contain no-repeat;
      margin-bottom: 30px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 10px #39ff14); }
      to { filter: drop-shadow(0 0 25px #39ff14); }
    }

    /* Title inside logo template */
    h1 {
      font-size: clamp(4rem, 10vw, 8rem); /* bigger title */
      font-weight: 900;
      color: #32cd32; /* toned neon green */
      text-shadow: 0 0 15px #32cd32, 0 0 30px #32cd32, 0 0 45px #32cd32;
      margin-bottom: 50px;
      letter-spacing: 3px;
    }

    /* Play button with pulse */
    .play-btn {
      background-color: #39ff14;
      border: none;
      border-radius: 50px;
      padding: clamp(18px, 3vw, 24px) clamp(50px, 8vw, 70px);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #2e2e2e; /* dark grey text to match button */
      cursor: pointer;
      box-shadow: 0 0 20px #39ff14, 0 0 40px #39ff14;
      animation: pulse 2s infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .play-btn:hover {
      box-shadow: 0 0 35px #39ff14, 0 0 70px #39ff14;
    }

    @media (max-width: 600px) {
      .logo {
        width: 140px;
        height: 140px;
      }
      h1 {
        margin-bottom: 40px;
      }
      .play-btn {
        border-radius: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="logo"></div>
  <h1>Quiz Fest</h1>
  <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
</body>
</html>
