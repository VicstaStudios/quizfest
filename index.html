<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0F1115 url('pattern.png') repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #F5F7FA;
      text-align: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-10%); /* pushes content upward */
    }

    .logo {
      width: 220px;
      height: 220px;
      background: url('quizfest-logo.png') center/contain no-repeat;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(5rem, 12vw, 10rem);
      font-weight: 900;
      color: #0047AB; /* cobalt blue */
      margin-bottom: 25px;
      letter-spacing: 4px;
    }

    .tagline {
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 600;
      color: #4F8CFF;
      margin-bottom: 50px;
    }

    .play-btn {
      background-color: #0047AB;
      border: none;
      border-radius: 50px;
      padding: clamp(20px, 3vw, 28px) clamp(60px, 8vw, 80px);
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      color: gold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .play-btn:hover,
    .play-btn:active {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(79, 140, 255, 0.6);
    }

    @media (max-width: 600px) {
      .logo { width: 150px; height: 150px; }
      h1 { margin-bottom: 20px; font-size: 3.5rem; }
      .tagline { font-size: 1.2rem; margin-bottom: 30px; }
      .play-btn { border-radius: 40px; }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="logo"></div>
    <h1>Quiz Fest</h1>
    <div class="tagline">Challenge Your Mind</div>
    <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
  </div>
</body>
</html>
