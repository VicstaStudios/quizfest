<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #1c1c1c url('pattern.png') repeat; /* dark grey with subtle pattern */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    /* Floating particles for lively background */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(255,215,0,0.2), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255,215,0,0.15), transparent 40%);
      animation: moveParticles 10s infinite alternate;
    }

    @keyframes moveParticles {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }

    /* Logo template */
    .logo {
      width: 200px;
      height: 200px;
      background: url('quizfest-logo.png') center/contain no-repeat;
      margin-bottom: 30px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 10px #FFD700); }
      to { filter: drop-shadow(0 0 25px #FFD700); }
    }

    /* Title */
    h1 {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 900;
      color: #FFD700; /* neon gold */
      text-shadow: 0 0 15px #FFD700, 0 0 30px #FFD700, 0 0 45px #FFD700;
      margin-bottom: 50px;
      letter-spacing: 3px;
    }

    /* Play button with shake */
    .play-btn {
      background-color: #FFD700; /* neon gold button */
      border: none;
      border-radius: 50px;
      padding: clamp(18px, 3vw, 24px) clamp(50px, 8vw, 70px);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #1c1c1c; /* dark grey text to match */
      cursor: pointer;
      box-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700;
      animation: shake 2s infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .play-btn:hover {
      box-shadow: 0 0 35px #FFD700, 0 0 70px #FFD700;
    }

    @media (max-width: 600px) {
      .logo {
        width: 140px;
        height: 140px;
      }
      h1 {
        margin-bottom: 40px;
      }
      .play-btn {
        border-radius: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="particles"></div>
  <div class="logo"></div>
  <h1>Quiz Fest</h1>
  <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
</body>
</html>
