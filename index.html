<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #1c1c1c url('pattern.png') repeat; /* dark grey with your pattern */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
      border: 3px solid gold; /* thin rectangular border */
      box-sizing: border-box;
    }

    /* Animated glowing particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(255,215,0,0.2), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255,215,0,0.15), transparent 40%);
      animation: moveParticles 10s infinite alternate;
    }

    @keyframes moveParticles {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }

    /* Logo */
    .logo {
      width: 200px;
      height: 200px;
      background: url('quizfest-logo.png') center/contain no-repeat;
      margin-bottom: 30px;
    }

    /* Title in ordinary gold */
    h1 {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 900;
      color: gold; /* ordinary gold */
      text-shadow: 0 0 10px rgba(255,215,0,0.5);
      margin-bottom: 20px;
      letter-spacing: 3px;
    }

    /* Double underline */
    .underline {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    .line1 {
      width: 60%;
      height: 6px;
      background-color: gold;
      margin: 2px 0;
    }
    .line2 {
      width: 60%;
      height: 3px;
      background-color: gold;
      margin: 2px 0;
    }

    /* Tagline */
    .tagline {
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 500;
      color: #FFD700;
      margin-bottom: 40px;
    }

    /* Play button with shake */
    .play-btn {
      background-color: gold;
      border: none;
      border-radius: 50px;
      padding: clamp(18px, 3vw, 24px) clamp(50px, 8vw, 70px);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #1c1c1c; /* dark grey text */
      cursor: pointer;
      box-shadow: 0 0 20px gold, 0 0 40px gold;
      animation: shake 2s infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .play-btn:hover {
      box-shadow: 0 0 35px gold, 0 0 70px gold;
    }

    @media (max-width: 600px) {
      .logo {
        width: 140px;
        height: 140px;
      }
      h1 {
        margin-bottom: 15px;
      }
      .line1, .line2 {
        width: 80%;
      }
      .play-btn {
        border-radius: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="particles"></div>
  <div class="logo"></div>
  <h1>Quiz Fest</h1>
  <div class="underline">
    <div class="line1"></div>
    <div class="line2"></div>
  </div>
  <div class="tagline">Challenge Your Mind</div>
  <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
</body>
</html>
