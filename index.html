<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('background.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: url('logo.png') center/contain no-repeat;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      color: #39ff14;
      text-shadow: 0 0 20px #39ff14, 0 0 40px #39ff14, 0 0 60px #39ff14;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .play-btn {
      background-color: #39ff14;
      border: none;
      border-radius: 50px;
      padding: clamp(15px, 3vw, 20px) clamp(40px, 8vw, 60px);
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
      color: #0a0a0a;
      cursor: pointer;
      box-shadow: 0 0 20px #39ff14, 0 0 40px #39ff14;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #39ff14, 0 0 60px #39ff14;
    }

    @media (max-width: 600px) {
      .logo {
        width: 80px;
        height: 80px;
      }
      h1 {
        margin-bottom: 30px;
      }
      .play-btn {
        border-radius: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="logo"></div>
  <h1>Quiz Fest</h1>
  <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
</body>
</html>
