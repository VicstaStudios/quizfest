<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0F1115 url('pattern.png') repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #F5F7FA;
      text-align: center;
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
    }

    .logo {
      width: 200px;
      height: 200px;
      background: url('quizfest-logo.png') center/contain no-repeat;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 900;
      color: #0047AB; /* cobalt blue */
      margin-bottom: 20px;
      letter-spacing: 3px;
    }

    .tagline {
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 500;
      color: #9AA4B2; /* secondary text */
      margin-bottom: 40px;
    }

    .play-btn {
      background-color: #0047AB; /* cobalt blue */
      border: none;
      border-radius: 50px;
      padding: clamp(18px, 3vw, 24px) clamp(50px, 8vw, 70px);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: gold; /* gold text */
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .play-btn:hover,
    .play-btn:active {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    @media (max-width: 600px) {
      .logo { width: 140px; height: 140px; }
      h1 { margin-bottom: 15px; font-size: 3rem; }
      .play-btn { border-radius: 40px; }
    }
  </style>
</head>
<body>
  <div class="logo"></div>
  <h1>Quiz Fest</h1>
  <div class="tagline">Challenge Your Mind</div>
  <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
</body>
</html>
