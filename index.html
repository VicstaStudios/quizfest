<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #1c1c1c; /* dark grey background */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
    }

    /* Logo with glow animation */
    .logo {
      width: 120px;
      height: 120px;
      background: url('logo.png') center/contain no-repeat;
      margin-bottom: 20px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 5px #39ff14); }
      to { filter: drop-shadow(0 0 20px #39ff14); }
    }

    /* Title */
    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      color: #32cd32; /* dimmer neon green */
      text-shadow: 0 0 10px #32cd32, 0 0 20px #32cd32, 0 0 30px #32cd32;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    /* Play button with pulse */
    .play-btn {
      background-color: #39ff14;
      border: none;
      border-radius: 50px;
      padding: clamp(15px, 3vw, 20px) clamp(40px, 8vw, 60px);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 900;
      color: #2e2e2e; /* dark grey text to match button */
      cursor: pointer;
      box-shadow: 0 0 20px #39ff14, 0 0 40px #39ff14;
      animation: pulse 2s infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .play-btn:hover {
      box-shadow: 0 0 30px #39ff14, 0 0 60px #39ff14;
    }

    @media (max-width: 600px) {
      .logo {
        width: 80px;
        height: 80px;
      }
      h1 {
        margin-bottom: 30px;
      }
      .play-btn {
        border-radius: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="logo"></div>
  <h1>Quiz Fest</h1>
  <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
</body>
</html>
