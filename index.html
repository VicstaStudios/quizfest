<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Fest</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0F1115 url('pattern.png') repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #F5F7FA;
      text-align: center;
      overflow: hidden;
      border: 3px solid gold;
      box-sizing: border-box;
      position: relative;
    }

    .logo {
      width: 200px;
      height: 200px;
      background: url('quizfest-logo.png') center/contain no-repeat;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 900;
      color: gold;
      margin-bottom: 20px;
      letter-spacing: 3px;
      border: 3px solid #50C878; /* emerald green border */
      padding: 10px 20px;
      border-radius: 12px;
      display: inline-block;
    }

    /* Double underline with emerald green border */
    .underline {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
    }
    .line1 {
      width: 65%;
      height: 6px;
      background-color: gold;
      border: 2px solid #50C878; /* emerald green border */
      margin: 2px 0;
      border-radius: 4px;
    }
    .line2 {
      width: 50%;
      height: 3px;
      background-color: gold;
      border: 2px solid #50C878; /* emerald green border */
      margin: 2px 0;
      border-radius: 4px;
    }

    .tagline {
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 500;
      color: #9AA4B2; /* secondary text */
      margin-bottom: 40px;
    }

    .play-btn {
      background-color: gold;
      border: none;
      border-radius: 50px;
      padding: clamp(18px, 3vw, 24px) clamp(50px, 8vw, 70px);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #0F1115;
      cursor: pointer;
      box-shadow: 0 0 20px gold, 0 0 40px gold;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .play-btn:hover,
    .play-btn:active {
      box-shadow: 0 0 25px #FFD700, 0 0 50px #FFD700, 0 0 75px #FFD700; /* neon gold glow */
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .logo { width: 140px; height: 140px; }
      h1 { margin-bottom: 15px; font-size: 3rem; }
      .line1, .line2 { width: 80%; }
      .play-btn { border-radius: 40px; }
    }
  </style>
</head>
<body>
  <div class="logo"></div>
  <h1>Quiz Fest</h1>
  <div class="underline">
    <div class="line1"></div>
    <div class="line2"></div>
  </div>
  <div class="tagline">Challenge Your Mind</div>
  <button class="play-btn" onclick="window.location.href='quiz.html'">PLAY</button>
</body>
</html>
