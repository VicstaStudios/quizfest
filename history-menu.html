<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celebs Menu</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: 'Poppins', Arial, sans-serif;
      color: #F5F7FA;
    }

    .category {
      background-color: #1A1D24;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(79,140,255,0.7);
    }

    .general {
      background: linear-gradient(to bottom right, #800080 50%, #DA70D6 100%);
      width: 100%;
      margin-bottom: 20px;
    }

    .emoji {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .main-text {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtext {
      font-size: 14px;
      font-weight: 600;
      color: rgba(230,240,255,0.9);
      filter: blur(0.2px);
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    @media (max-width: 600px) {
      .subjects {
        grid-template-columns: repeat(2, 1fr); /* two per row on phones */
      }
      .main-text { font-size: 18px; }
      .subtext { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- General Celebs Quiz -->
  <div class="category general" onclick="location.href='celebs.html'">
    <div class="main-text">General Celebs Quiz</div>
    <div class="subtext">Naija Vibes · Hollywood · Social Media · Specials</div>
  </div>

  <!-- Special subsections -->
  <div class="subjects">
    <div class="category" onclick="location.href='naija-celebs.html'">
      <div class="emoji">🇳🇬</div>
      <div class="main-text">Naija Vibes</div>
      <div class="subtext">Music · Nollywood · Influencers</div>
    </div>

    <div class="category" onclick="location.href='hollywood-celebs.html'">
      <div class="emoji">🎬</div>
      <div class="main-text">Hollywood</div>
      <div class="subtext">Movies · Stars · Awards</div>
    </div>

    <div class="category" onclick="location.href='social-celebs.html'">
      <div class="emoji">📱</div>
      <div class="main-text">Social Media</div>
      <div class="subtext">TikTok · Instagram · YouTube</div>
    </div>

    <div class="category" onclick="location.href='celebs-specials.html'">
      <div class="emoji">🌟</div>
      <div class="main-text">Specials</div>
      <div class="subtext">Grammy · Oscar · Global Icons</div>
    </div>
  </div>
</body>
</html>
