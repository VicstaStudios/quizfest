<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History Menu</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: 'Poppins', Arial, sans-serif;
      color: #F5F7FA;
    }

    .category {
      background-color: #1A1D24;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(79,140,255,0.7);
    }

    .general {
      background: linear-gradient(to bottom right, #8B0000 50%, #FFA07A 100%);
      width: 100%;
      margin-bottom: 20px;
    }

    .emoji { font-size: 28px; margin-bottom: 6px; }
    .main-text { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtext { font-size: 14px; font-weight: 600; color: rgba(230,240,255,0.9); }

    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    @media (max-width: 600px) {
      .subjects {
        grid-template-columns: repeat(2, 1fr); /* two per row on phones */
      }
      .main-text { font-size: 18px; }
      .subtext { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- General History Quiz -->
  <div class="category general" onclick="location.href='history.html'">
    <div class="main-text">General History Quiz</div>
    <div class="subtext">Ancient · Medieval · Modern</div>
  </div>

  <!-- Subject-specific categories -->
  <div class="subjects">
    <div class="category" onclick="location.href='ancient-history.html'">
      <div class="emoji">🏺</div>
      <div class="main-text">Ancient History</div>
      <div class="subtext">Egypt · Greece · Rome</div>
    </div>
    <div class="category" onclick="location.href='medieval-history.html'">
      <div class="emoji">⚔️</div>
      <div class="main-text">Medieval History</div>
      <div class="subtext">Knights · Castles · Crusades</div>
    </div>
    <div class="category" onclick="location.href='modern-history.html'">
      <div class="emoji">🌍</div>
      <div class="main-text">Modern History</div>
      <div class="subtext">Revolutions · World Wars · Globalization</div>
    </div>
  </div>
</body>
</html>
