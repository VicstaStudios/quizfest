<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Fest - Categories</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: 'Poppins', Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      color: #F5F7FA;
    }

    .category {
      position: relative;
      flex: 1 1 300px; /* responsive width */
      max-width: 400px;
      height: 180px;
      background-color: #1A1D24;
      color: #F5F7FA;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      text-align: center;
    }

    .category:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 20px rgba(79,140,255,0.6);
    }

    .hot-sticker {
      position: absolute;
      top: -12px;
      right: -12px;
      background-color: #4F8CFF;
      color: #F5F7FA;
      font-size: 16px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(79,140,255,0.7);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .category {
        flex: 1 1 100%;
        max-width: 100%;
        height: 140px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <!-- Categories -->
  <div class="category" onclick="location.href='science.html'">Science</div>
  <div class="category" onclick="location.href='arts.html'">Arts</div>
  <div class="category" onclick="location.href='finance.html'">Finance</div>
  <div class="category" onclick="location.href='bible.html'">Bible Knowledge</div>

  <div class="category" onclick="location.href='football.html'">
    Football
    <div class="hot-sticker">HOT</div>
  </div>

  <div class="category" onclick="location.href='celebs.html'">
    Celebs
    <div class="hot-sticker">HOT</div>
  </div>
</body>
</html>
