<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Fest - Categories</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .category {
      position: relative;
      width: 200px;
      height: 100px;
      background-color: #2e2e2e;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .category:hover {
      background-color: #444;
    }

    .hot-sticker {
      position: absolute;
      top: -10px;
      right: -10px;
      background-color: red;
      color: white;
      font-size: 14px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- Categories -->
  <div class="category" onclick="location.href='science.html'">Science</div>
  <div class="category" onclick="location.href='arts.html'">Arts</div>
  <div class="category" onclick="location.href='finance.html'">Finance</div>
  <div class="category" onclick="location.href='bible.html'">Bible Knowledge</div>

  <div class="category" onclick="location.href='football.html'">
    Football
    <div class="hot-sticker">HOT</div>
  </div>

  <div class="category" onclick="location.href='celebs.html'">
    Celebs
    <div class="hot-sticker">HOT</div>
  </div>
</body>
</html>
