<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Fest - Categories</title>
  <style>
    :root {
      --font-sans: 'Poppins', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 30px;
      background-color: #0F1115;
      font-family: var(--font-sans);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      justify-items: center;
      color: #F5F7FA;
    }

    .category {
      width: 100%;
      max-width: 320px;
      height: 180px;
      background-color: #1A1D24;
      color: #F5F7FA;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      padding: 18px;
      text-align: center;
    }

    .category:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 20px rgba(79,140,255,0.6);
    }

    .emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .main-text {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: auto; /* pushes subtext down */
    }

    .subtext {
      font-size: 14px;
      font-weight: 400;
      color: #9AA4B2;
      margin-top: auto;
    }

    /* Mobile: two per row */
    @media (max-width: 600px) {
      body {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      .category {
        height: 150px;
      }
      .emoji { font-size: 26px; }
      .main-text { font-size: 18px; }
      .subtext { font-size: 12px; }
    }

    /* Larger screens: three per row */
    @media (min-width: 900px) {
      body {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <!-- Categories -->
  <div class="category" onclick="location.href='science-menu.html'">
    <div class="emoji">⚗️</div>
    <div class="main-text">Science</div>
    <div class="subtext">Physics · Chemistry · Biology</div>
  </div>

  <div class="category" onclick="location.href='arts-menu.html'">
    <div class="emoji">🎨</div>
    <div class="main-text">Arts</div>
    <div class="subtext">Govt · Lit-in-English · Social</div>
  </div>

  <div class="category" onclick="location.href='finance-menu.html'">
    <div class="emoji">📈</div>
    <div class="main-text">Finance</div>
    <div class="subtext">Money · Econs · Acct</div>
  </div>

  <div class="category" onclick="location.href='bible-menu.html'">
    <div class="emoji">✝️</div>
    <div class="main-text">Bible Knowledge</div>
    <div class="subtext">Old Testament · New Testament · Bible</div>
  </div>

  <div class="category" onclick="location.href='football-menu.html'">
    <div class="emoji">⚽</div>
    <div class="main-text">Football</div>
    <div class="subtext">Clubs · Nations · Legends</div>
  </div>

  <div class="category" onclick="location.href='celebs-menu.html'">
    <div class="emoji">🎤</div>
    <div class="main-text">Celebs</div>
    <div class="subtext">Naija · TikTok · IG</div>
  </div>
</body>
</html>
