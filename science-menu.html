<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Science Menu</title>
  <style>
    :root {
      --font-sans: 'Poppins', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: var(--font-sans);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      color: #F5F7FA;
    }

    .category {
      background-color: #1A1D24;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(79,140,255,0.7); /* neon blue glow */
    }

    /* General Science Quiz special styling */
    .general {
      background: linear-gradient(
        to bottom right,
        red 50%,      /* solid red until halfway */
        #ffcccc 100%  /* fade to light red at lower right */
      );
      width: calc(100% - 14px); /* full width minus padding */
    }

    .emoji {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .main-text {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtext {
      font-size: 14px;
      font-weight: 600;
      color: rgba(154,164,178,0.7); /* blur-like faded color */
      filter: blur(0.2px);
    }

    /* Grid for subject boxes */
    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    @media (max-width: 600px) {
      .subjects {
        grid-template-columns: repeat(2, 1fr); /* two per row on mobile */
      }
      .main-text { font-size: 18px; }
      .emoji { font-size: 24px; }
      .subtext { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- General Science Quiz -->
  <div class="category general" onclick="location.href='science.html'">
    <div class="main-text">General Science Quiz</div>
    <div class="subtext">Physics · Chemistry · Biology · All science related</div>
  </div>

  <!-- Subject-specific categories -->
  <div class="subjects">
    <div class="category" onclick="location.href='physics.html'">
      <div class="emoji">🧪</div>
      <div class="main-text">Physics</div>
      <div class="subtext">Mechanics · Energy · Waves</div>
    </div>

    <div class="category" onclick="location.href='chemistry.html'">
      <div class="emoji">⚛️</div>
      <div class="main-text">Chemistry</div>
      <div class="subtext">Atoms · Reactions · Compounds</div>
    </div>

    <div class="category" onclick="location.href='biology.html'">
      <div class="emoji">🧬</div>
      <div class="main-text">Biology</div>
      <div class="subtext">Cells · Genetics · Ecology</div>
    </div>

    <div class="category" onclick="location.href='geography.html'">
      <div class="emoji">🌍</div>
      <div class="main-text">Geography</div>
      <div class="subtext">Earth · Climate · Regions</div>
    </div>
  </div>
</body>
</html>
