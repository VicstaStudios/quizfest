<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Menu</title>

  <style>

    :root {
      --font-sans: 'Poppins', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: var(--font-sans);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      color: #F5F7FA;
      overflow-x: hidden;
    }

    .category {
      background-color: #1A1D24;
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(79,140,255,0.7);
    }

    /* General Finance Quiz special styling */
    .general {
      background: linear-gradient(
        to bottom right,
        teal 50%,
        #ccfff2 100%
      );
      width: 100%;
    }

    .emoji {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .main-text {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .subtext {
      font-size: 14px;
      font-weight: 600;
      color: rgba(154,164,178,0.7);
      filter: blur(0.2px);
      line-height: 1.5;
    }

    /* Grid for subject boxes */
    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      width: 100%;
    }

    /* =========================
       MOBILE OPTIMIZATION
    ========================= */
    @media (max-width: 600px) {

  body {
    padding: 15px;
  }

  .subjects,
  .specials {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .category {
    padding: 16px;
    border-radius: 14px;
  }

  .main-text {
    font-size: 18px;
    line-height: 1.3;
  }

  .subtext {
    font-size: 12px;
    line-height: 1.4;
  }

  .emoji {
    font-size: 24px;
  }

  .specials-heading {
    font-size: 15px;
    margin-top: 16px;
  }

}

  </style>
</head>

<body>

  <!-- General Finance Quiz -->
  <div class="category general" onclick="location.href='finance.html'">
    <div class="main-text">General Finance Quiz</div>
    <div class="subtext">Commerce · Marketing · Economics · Accounting</div>
  </div>

  <!-- Subject-specific categories -->
  <div class="subjects">

    <div class="category" onclick="location.href='commerce.html'">
      <div class="emoji">💼</div>
      <div class="main-text">Commerce</div>
      <div class="subtext">Trade · Business · Exchange</div>
    </div>

    <div class="category" onclick="location.href='marketing.html'">
      <div class="emoji">📊</div>
      <div class="main-text">Marketing</div>
      <div class="subtext">Advertising · Strategy · Sales</div>
    </div>

    <div class="category" onclick="location.href='economics.html'">
      <div class="emoji">📈</div>
      <div class="main-text">Economics</div>
      <div class="subtext">Micro · Macro · Development</div>
    </div>

    <div class="category" onclick="location.href='accounting.html'">
      <div class="emoji">🧾</div>
      <div class="main-text">Accounting</div>
      <div class="subtext">Trial Balance · Balance Sheets · Ledger</div>
    </div>

  </div>

</body>
</html>
