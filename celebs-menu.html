<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celebs Menu</title>
  <style>
    :root {
      --font-sans: 'Poppins', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: var(--font-sans);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      color: #F5F7FA;
    }

    .category {
      background-color: #1A1D24;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(79,140,255,0.7); /* neon blue glow */
    }

    /* General Celeb Quiz special styling */
    .general {
      background: linear-gradient(
        to bottom right,
        purple 50%,   /* solid purple until halfway */
        gold 100%     /* fade to gold at lower right */
      );
      width: calc(100% - 14px);
    }

    .emoji {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .main-text {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtext {
      font-size: 14px;
      font-weight: 600;
      color: rgba(230,240,255,0.9); /* brighter bluish-white */
      filter: blur(0.2px);
    }

    /* Grid for subject boxes */
    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    /* Specials heading */
    .specials-heading {
      font-size: 16px;
      font-weight: 700;
      color: rgba(230,240,255,0.9);
      margin-top: 10px;
    }

    /* Specials grid */
    .specials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    /* Specials gradients */
    .grammy {
      background: linear-gradient(to bottom right, royalblue 50%, silver 100%);
    }
    .oscar {
      background: linear-gradient(to bottom right, gold 50%, #fff8dc 100%);
    }

    @media (max-width: 600px) {
      .subjects, .specials {
        grid-template-columns: repeat(2, 1fr); /* two per row on mobile */
      }
      .main-text { font-size: 18px; }
      .emoji { font-size: 24px; }
      .subtext { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- General Celeb Quiz -->
  <div class="category general" onclick="location.href='celebs.html'">
    <div class="main-text">General Celeb Quiz</div>
    <div class="subtext">Naija Vibes · Hollywood · Social Media</div>
  </div>

  <!-- Subject-specific categories -->
  <div class="subjects">
    <div class="category" onclick="location.href='naija-vibes.html'">
      <div class="emoji">🇳🇬</div>
      <div class="main-text">Naija Vibes</div>
      <div class="subtext">Afrobeats · Nollywood · Stars</div>
    </div>

    <div class="category" onclick="location.href='hollywood.html'">
      <div class="emoji">🎬</div>
      <div class="main-text">Hollywood</div>
      <div class="subtext">Movies · Celebrities · Fame</div>
    </div>

    <div class="category" onclick="location.href='social-media.html'">
      <div class="emoji">📱</div>
      <div class="main-text">Social Media</div>
      <div class="subtext">Influencers · Trends · Platforms</div>
    </div>
  </div>

  <!-- Specials heading -->
  <div class="specials-heading">Specials</div>

  <!-- Specials categories -->
  <div class="specials">
    <div class="category grammy" onclick="location.href='grammy.html'">
      <div class="main-text">Grammy</div>
      <div class="subtext">Music Industry</div>
    </div>

    <div class="category oscar" onclick="location.href='oscar.html'">
      <div class="main-text">Oscar</div>
      <div class="subtext">Own the Spotlight</div>
    </div>
  </div>
</body>
</html>
