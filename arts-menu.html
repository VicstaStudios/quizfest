<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arts Menu</title>
  <style>
    :root {
      --font-sans: 'Poppins', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0F1115;
      font-family: var(--font-sans);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      color: #F5F7FA;
    }

    .category {
      background-color: #1A1D24;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(79,140,255,0.7); /* neon blue glow */
    }

    /* General Arts Quiz special styling */
    .general {
      background: linear-gradient(
        to bottom right,
        purple 50%,   /* solid purple until halfway */
        #e6ccff 100%  /* fade to light lavender at lower right */
      );
      width: calc(100% - 14px); /* full width minus padding */
    }

    .emoji {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .main-text {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtext {
      font-size: 14px;
      font-weight: 600; /* bold tagline */
      color: #F5F7FA;   /* keep text bright for visibility */
    }

    /* Grid for subject boxes */
    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    @media (max-width: 600px) {
      .subjects {
        grid-template-columns: repeat(2, 1fr); /* two per row on mobile */
      }
      .main-text { font-size: 18px; }
      .emoji { font-size: 24px; }
      .subtext { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- General Arts Quiz -->
  <div class="category general" onclick="location.href='arts.html'">
    <div class="main-text">General Arts Quiz</div>
    <div class="subtext">Government · Literature in English · Social Studies</div>
  </div>

  <!-- Subject-specific categories -->
  <div class="subjects">
    <div class="category" onclick="location.href='government.html'">
      <div class="emoji">🏛️</div>
      <div class="main-text">Government</div>
      <div class="subtext">Politics · Institutions · Law</div>
    </div>

    <div class="category" onclick="location.href='literature.html'">
      <div class="emoji">📚</div>
      <div class="main-text">Literature in English</div>
      <div class="subtext">Poetry · Drama · Prose</div>
    </div>

    <div class="category" onclick="location.href='social-studies.html'">
      <div class="emoji">🌍</div>
      <div class="main-text">Social Studies</div>
      <div class="subtext">Culture · Society · History</div>
    </div>
  </div>
</body>
</html>
